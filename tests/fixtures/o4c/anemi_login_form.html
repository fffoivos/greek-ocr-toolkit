<form action="#" name="login_form" method="post" id="login_form">
            <input type="hidden" name="action" value="authorize" />
            <table>
              <tr>
                <td colspan="2">
                  <label xml:lang="en" for="id" lang="en">Enter Login ID:</label>
                </td>
              </tr>
              <tr>
                <td colspan="2">
                  <input type="text" id="id" name="username" size="40" />
                </td>
              </tr>
              <tr>
                <td colspan="2">
                  <label xml:lang="en" for="passwd" lang="en">Enter password:</label>
                </td>
              </tr>
              <tr>
                <td colspan="2">
                  <input type="password" id="passwd" name="password" size="40" />
                </td>
              </tr>
              <tr>
                <td>
                  <input class="checkbox" type="checkbox" id="savelogin" name="savelogin" />
                </td>
                <td>
                  <label xml:lang="en" for="savelogin" lang="en">Keep me signed in for 2 weeks<br />unless I sign out.</label>
                  <p class="nomargins" xml:lang="en" style="font-size:7pt;" lang="en">[Uncheck if on a shared computer]</p>
                </td>
              </tr>
              <tr>
                <td colspan="2">
                  <div class="right"></div>
                  <div class="right">
                    <input class="submit" type="submit" value="Sign In" xml:lang="en" lang="en" />
                  </div>
                </td>
              </tr>
            </table>
          </form>
