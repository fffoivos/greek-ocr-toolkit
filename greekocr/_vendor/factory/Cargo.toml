[package]
name = "linefactory"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Parallel synthetic line-strip factory for the greek-page-ocr recognizer (recipe -> pool -> select -> render -> distort -> gate -> audit -> parquet shards)"

[[bin]]
name = "linefactory"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
rand = "0.8"
rand_chacha = "0.3"
unicode-normalization = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rustybuzz = "0.18"
ttf-parser = "0.24"
zeno = "0.3"
walkdir = "2"
sha2 = "0.10"
arrow-array = "53"
arrow-schema = "53"
parquet = { version = "53", features = ["arrow", "zstd"] }

[profile.release]
opt-level = 3
lto = "thin"
