[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "greek-ocr-toolkit"
version = "0.1.0"
description = "Private, provenance-preserving Greek OCR tools and offline contracts"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "Pillow>=10", "pypdfium2>=4", "scipy>=1.10", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
web = ["playwright>=1.50,<2"]
docai = ["requests>=2.31", "google-auth>=2.29"]
readers = ["torch>=2.6", "safetensors>=0.7", "pyarrow>=14", "PyYAML>=6"]
warmstart = ["torch>=2.6", "safetensors>=0.7", "opencv-python-headless>=4.8", "transformers>=4.55", "PyYAML>=6"]
docling = ["onnxruntime>=1.17", "onnx>=1.16; sys_platform == 'darwin'", "huggingface_hub>=0.24", "pyclipper>=1.3", "shapely>=2", "docling>=2", "torch>=2.6", "safetensors>=0.7", "opencv-python-headless>=4.8"]
test = ["pytest>=8", "torch>=2.6", "pyarrow>=14", "safetensors>=0.7", "opencv-python-headless>=4.8", "PyYAML>=6", "docling>=2", "requests>=2.31", "google-auth>=2.29"]

[project.scripts]
greekocr = "greekocr.cli:main"
greekocr-filter-lines = "greekocr.harvest.line_pipeline_census:main"

[project.entry-points.docling]
glossapi = "greekocr.deploy.docling_plugin.docling_plugin"

[tool.setuptools.packages.find]
include = ["greekocr*"]
namespaces = true

[tool.setuptools.package-data]
"greekocr" = ["py.typed"]
"greekocr.segmenters._vendor" = ["SOURCE.json"]
"greekocr.train" = ["codec/*.json", "mix.schema.json", "CONSOLIDATION.md", "LEGACY_COMPARISON.diff"]
"greekocr._vendor" = ["**/*.json", "**/*.rs", "**/*.sh", "**/*.toml", "**/*.lock", "**/*.yml", "**/*.md", "**/*.txt", "**/LICENSE"]
"greekocr.deploy.docling_plugin" = ["recognizer/*.json"]
"greekocr.annotate" = ["fixtures/*.json"]
"greekocr.verify" = ["sample_distribution.json"]
"greekocr.harvest" = ["filtering_assets/*.json", "filtering_assets/*.js", "filtering_assets/*.mjs", "filtering_assets/*.py", "filtering_assets/collector/collect_v3/vendor/geometry/*.py"]
"greekocr.adjudicate" = ["*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: opt-in real Hugging Face downloads (GREEKOCR_NETWORK_TESTS=1)"]
